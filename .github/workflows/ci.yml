name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.mjs public/js/*.js test/*.mjs; do
            node --check "$file"
          done

      - name: Run test suite
        run: node --test 'test/*.test.mjs'
